name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Inject Pl@ntNet API key
        env:
          PLANTNET_API_KEY: ${{ secrets.PLANTNET_API_KEY }}
        run: |
          if [ -z "$PLANTNET_API_KEY" ]; then
            echo "::error::GitHub secret PLANTNET_API_KEY is not set. Add it under Settings → Secrets and variables → Actions."
            exit 1
          fi
          node -e "
            const fs = require('fs');
            const key = process.env.PLANTNET_API_KEY;
            const content = 'window.PLANT_IDENTIFIER_CONFIG = {\n  PLANTNET_API_KEY: ' + JSON.stringify(key) + '\n};\n';
            fs.writeFileSync('assets/js/plant-identifier-config.js', content);
          "

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload site artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: .

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
