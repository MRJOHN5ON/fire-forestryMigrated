name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Inject plant ID proxy URL
        env:
          PLANTNET_PROXY_URL: ${{ secrets.PLANTNET_PROXY_URL }}
        run: |
          if [ -z "$PLANTNET_PROXY_URL" ]; then
            echo "::error::GitHub secret PLANTNET_PROXY_URL is not set. Deploy api/plantnet-identify.js to Vercel, then add the function URL (e.g. https://your-project.vercel.app/api/plantnet-identify)."
            exit 1
          fi
          node -e "
            const fs = require('fs');
            const proxyUrl = process.env.PLANTNET_PROXY_URL;
            const content = 'window.PLANT_IDENTIFIER_CONFIG = {\n  PLANTNET_PROXY_URL: ' + JSON.stringify(proxyUrl) + '\n};\n';
            fs.writeFileSync('assets/js/plant-identifier-config.js', content);
          "

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload site artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: .

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
